<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="calculator">
        <div class="input_area" style="width: 400px;">
            <input class="inputOne" type="text">
            <input class="inputTwo" type="text">
        </div>

        <h2 class="result">0</h2>

        <div class="button_area">
            <button class="plus_btn">Plus</button>
            <button class="minus_btn">Minus</button>
            <button class="mult_btn">Mult</button>
            <button class="divide_btn">Divide</button>
            <button class="reset_btn">Reset</button>
        </div>
    </div>


    <script src="./assets/js/script.js"></script>
</body>

</html>
